<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EJOT Iso-Bar ECO Report Generator</title>
    <!-- Archivo: Grotesk mit DIN-Anklang für die Oberfläche · IBM Plex Mono: Kennwerte/Plankopf.
         Die Report-Sektionen (PDF-Export) bleiben bewusst bei Segoe UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --rot: #c8102e;
        --rot-tief: #8e0b22;
        --zink: #15191e;
        --zink-hell: #232930;
        --papier: #f4f2ee;
        --graphit: #1a1a1a;
        --ui: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      }
      html { background: var(--papier); }
      body {
        font-family: var(--ui);
        color: var(--graphit);
        /* Millimeterpapier: feines Raster (5 mm) mit kräftigerer Linie alle 25 mm */
        background:
          linear-gradient(rgba(26, 26, 26, 0.055) 1px, transparent 1px) 0 0 / 100px 100px,
          linear-gradient(90deg, rgba(26, 26, 26, 0.055) 1px, transparent 1px) 0 0 / 100px 100px,
          linear-gradient(rgba(26, 26, 26, 0.03) 1px, transparent 1px) 0 0 / 20px 20px,
          linear-gradient(90deg, rgba(26, 26, 26, 0.03) 1px, transparent 1px) 0 0 / 20px 20px,
          var(--papier);
      }
      ::selection { background: rgba(200, 16, 46, 0.18); }
      button { font-family: inherit; }
      input, select, textarea { font-family: inherit; }
      :focus-visible { outline: 2px solid var(--rot); outline-offset: 2px; border-radius: 3px; }

      /* Schlanke Scrollleisten passend zur Werkleiste */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #c9c5be; border-radius: 5px; border: 2px solid var(--papier); }
      ::-webkit-scrollbar-thumb:hover { background: #a9a49c; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes zeichnen { to { stroke-dashoffset: 0; } }
      .stepFade { animation: fadeUp 0.28s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
      .menuPop { animation: fadeUp 0.16s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
